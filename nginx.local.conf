# ============================================================
# nginx.local.conf — Dùng cho local Docker Compose test
# Upstream trỏ vào Docker service names thay vì VPS IP thật
# ============================================================

upstream backend_cluster {
    least_conn;                     # Thuật toán Least Connection
    server backend_node1:8080;      # BE Node 1 — Docker service name
    server backend_node2:8080;      # BE Node 2 — Docker service name
    keepalive 32;
}

server {
    listen 80;
    server_name localhost 192.168.1.13 192.168.1.24;

    root /usr/share/nginx/html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # ── Health check ──────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── /a/* → Frontend React SPA (Vite base: '/a/') ─────────
    location ^~ /a/ {
        try_files $uri $uri/ /a/index.html;

        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ── /api/* → Load balance đến BE cluster ─────────────────
    location /api/ {
        proxy_pass         http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffer_size         4k;
        proxy_buffers             8 16k;
        proxy_busy_buffers_size   32k;
    }

    # ── /<short_code> → proxy đến BE /view/<short_code> ──────
    location ~ "^/([a-zA-Z0-9]{4,20})$" {
        set $short_code $1;
        proxy_pass         http://backend_cluster/view/$short_code;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── / → redirect sang /a/ ────────────────────────────────
    location = / {
        return 301 /a/;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
