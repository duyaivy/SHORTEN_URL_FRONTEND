upstream backend_cluster {
    least_conn;
    server backend:8080 max_fails=3 fail_timeout=10s;      # BE Node 1 — VPS 1 (Docker network)
    server ${VPS2_IP}:8080 max_fails=3 fail_timeout=10s;   # BE Node 2 — VPS 2 (Injected via env)
    keepalive 32;
}

# 1. Server HTTP (Port 80) — Redirect to HTTPS & ACME challenge for Certbot
server {
    listen 80;
    listen [::]:80;
    server_name url.duyaivy.id.vn;

    # Certbot verification path for renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check on HTTP
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Server HTTPS (Port 443) — Main Application
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name url.duyaivy.id.vn;

    # SSL Certificate files (Mounted from VPS host /etc/letsencrypt)
    ssl_certificate     /etc/letsencrypt/live/url.duyaivy.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/url.duyaivy.id.vn/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    # Certbot verification path for renewal on HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # Health check on HTTPS
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # /a/* → Frontend React SPA (Vite base: '/a/')
    location ^~ /a/ {
        try_files $uri $uri/ /a/index.html;

        location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|wasm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # /api/* → Load balance 50/50 to BE cluster
    location ^~ /api/ {
        proxy_pass         http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffer_size         4k;
        proxy_buffers             8 16k;
        proxy_busy_buffers_size   32k;
    }

    # /<short_code> → proxy to BE /view/<short_code> for shortlink redirect
    # Sử dụng $request_uri để giữ nguyên URL encoding (%23 cho #, _, -, tiếng Việt, query string, v.v.)
    location ~ "^/([^/]+)$" {
        proxy_pass         http://backend_cluster/view$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # / → redirect to /a/
    location = / {
        return 301 /a/;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
